---
# For some reason we are not able to generate cert by Cert Manager
# This is the workaround, use Goolge Manage Cert instead
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: managed-cert-4
spec:
  domains:
    - 'www.{{ .Values.domain7 }}'
    - '{{ .Values.domain7 }}'
    - 'www.{{ .Values.domain9 }}'
    - '{{ .Values.domain9 }}'
    - 'www.{{ .Values.domain10 }}'
    - '{{ .Values.domain10 }}'
    - 'www.{{ .Values.domain11 }}'
    - '{{ .Values.domain11 }}'
    - 'www.{{ .Values.domain12 }}'
    - '{{ .Values.domain12 }}'
