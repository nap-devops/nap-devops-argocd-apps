{{- if .Values.backupRestore.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.backupRestore.namePrefix }}-backup-sa
  #namespace: {{ .Values.backupRestore.app.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.backupRestore.namePrefix }}-backup-role
  #namespace: {{ .Values.backupRestore.app.namespace }}
rules:
  # Needed to find the app pod by name (its name changes on restart) and to
  # restart it after a restore.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  # Needed for kubectl exec / kubectl cp against the DB pod and the app pod.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.backupRestore.namePrefix }}-backup-rb
  #namespace: {{ .Values.backupRestore.app.namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.backupRestore.namePrefix }}-backup-sa
    namespace: {{ .Values.backupRestore.app.namespace }}
roleRef:
  kind: Role
  name: {{ .Values.backupRestore.namePrefix }}-backup-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
