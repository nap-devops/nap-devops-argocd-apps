domain: keycloak.devops.napbiotec.io

keycloak:
  enabled: true
  extraEnv: |
    - name: KEYCLOAK_LOGLEVEL
      value: DEBUG
    - name: PROXY_ADDRESS_FORWARDING
      value: "true"
    - name: KEYCLOAK_USER
      valueFrom:
        secretKeyRef:
          name: keycloak-admin
          key: keycloak-user
    - name: KEYCLOAK_PASSWORD
      valueFrom:
        secretKeyRef:
          name: keycloak-admin
          key: keycloak-password
  securityContext:
    runAsUser: 0
    runAsNonRoot: false

  postgresql:  
    enabled: true  
    persistence:
      size: 20Gi
    image:
      repository: bitnamilegacy/postgresql
      tag: "11.14.0"

