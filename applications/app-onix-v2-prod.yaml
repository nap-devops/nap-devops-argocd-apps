apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: onix-v2-prod
spec:
  generators:
  - clusters:
      selector:
        matchLabels:
          custom: "true"
  template:
    metadata:
      name: 'onix-v2-prod'
    spec:
      project: "default"
      source:
        repoURL: https://github.com/wintech-thai/onix-v2-argocd-apps.git
        targetRevision: "production" #Based on environment
        path: '.'
        helm:
          ignoreMissingValueFiles: true
          valueFiles:
            - values-files/values-production.yaml

            # Kong
            - values-files/kong/kong-00-values.yaml
            # PostgreSQL
            - values-files/postgresql/postgresql-00-values.yaml
            # Redis
            - values-files/redis/redis-00-values.yaml

            # Onix-API
            - values-files/onix-api/onix-api-00-values.yaml
            - values-files/onix-api/onix-api-01-production-values.yaml
            - values-files/onix-api/onix-api-03-production-image-tag.yaml

            # Onix-Console
            - values-files/onix-console/onix-console-00-values.yaml
            - values-files/onix-console/onix-console-01-production-values.yaml
            - values-files/onix-console/onix-console-03-production-image-tag.yaml

            # Onix-Member
            - values-files/onix-member/onix-member-00-values.yaml
            - values-files/onix-member/onix-member-01-production-values.yaml
            - values-files/onix-member/onix-member-03-production-image-tag.yaml

            # Onix-Admin
            - values-files/onix-admin/onix-admin-00-values.yaml
            - values-files/onix-admin/onix-admin-01-production-values.yaml
            - values-files/onix-admin/onix-admin-03-production-image-tag.yaml

            # Onix-Register
            - values-files/onix-register/onix-register-00-values.yaml
            - values-files/onix-register/onix-register-01-production-values.yaml
            - values-files/onix-register/onix-register-03-production-image-tag.yaml

            # Onix-Jobs
            - values-files/onix-jobs/onix-jobs-00-values.yaml
            - values-files/onix-jobs/onix-jobs-01-production-values.yaml
            - values-files/onix-jobs/onix-jobs-03-production-image-tag.yaml

            # Onix-Web-Scan
            - values-files/onix-web-scan/onix-web-scan-00-values.yaml
            - values-files/onix-web-scan/onix-web-scan-01-production-values.yaml
            - values-files/onix-web-scan/onix-web-scan-03-production-image-tag.yaml

            # Please-Scan-Web
            - values-files/please-scan-web/please-scan-web-00-values.yaml
            - values-files/please-scan-web/please-scan-web-01-production-values.yaml
            - values-files/please-scan-web/please-scan-web-03-production-image-tag.yaml

            # Dev-Hubs-Web
            - values-files/dev-hubs-web/dev-hubs-web-00-values.yaml
            - values-files/dev-hubs-web/dev-hubs-web-01-production-values.yaml
            - values-files/dev-hubs-web/dev-hubs-web-03-production-image-tag.yaml

            # Please-Protect-Portal
            - values-files/please-protect-portal/please-protect-portal-00-values.yaml
            - values-files/please-protect-portal/please-protect-portal-01-production-values.yaml
            - values-files/please-protect-portal/please-protect-portal-03-production-image-tag.yaml

            # Please-Protect-Center
            - values-files/please-protect-center/please-protect-center-00-values.yaml
            - values-files/please-protect-center/please-protect-center-01-production-values.yaml
            - values-files/please-protect-center/please-protect-center-03-production-image-tag.yaml
      destination:
        name: in-cluster
        namespace: onix-v2-production
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
